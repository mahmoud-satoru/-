                    <h3>المتحف القومي للحضاره المصريه</h3>

                        <source src="audios/s1.m4a" type="audio/mpeg">
                    </audio>
                    <button class="fav-btn" onclick="addToFavorites(1, 'المتحف القومي للحضاره المصريه', 'videos/v1.mp4')">❤️ أضف للمفضلة</button>
