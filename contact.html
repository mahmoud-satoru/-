        <header>
            <h1>تواصل معنا</h1>
            <h3 class="title2">نحن هنا لمساعدتك في اكتشاف جمال مصر و اثارها الخالدة</h3>
        </header>
        <section>
            <h3>أرسل سؤالك أو مشكلتك وسيتم الرد في أقرب وقت</h3>
            <form id="contactForm">
                <label for="name">الأسم:</label>
                <input type="text" id="name" placeholder="الأسم بالكامل">
                <label for="number">رقم الهاتف:</label>
                <input type="number" id="number" placeholder="رقم الهاتف الصحيح">
                <label for="email">البريد الالكتروني:</label>
                <input type="email" id="email" placeholder="البريد الالكتروني">
                <label for="message">الرسالة:</label>
                <textarea id="message" placeholder="رسالتك أو مشكلتك" ></textarea>
                <button type="reset">حذف</button>
                <button type="submit">ارسال</button>
            </form>
             <p id="responseMsg"></p>
        </section>
        <section>
            <h3>للتواصل</h3>
             <p>العنوان: القاهرة، مصر</p>
             <p>الهاتف: 01012345678</p>
             <p>البريد الإلكتروني: info@egypttourism.com</p>
        </section>
          <footer>
                    <p>موقع الاثار والسياحة-2026</p>
                </footer>
